modLoader = "javafml"
loaderVersion = "[${forge_major},)"
license = "${license}"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
description = "${description}"
# Server-only: vanilla and unmodded clients may join. 1.18.2 registers this in code instead.
displayTest = "IGNORE_SERVER_VERSION"

[[dependencies.${id}]]
modId = "forge"
mandatory = true
versionRange = "[${forge_major},)"
ordering = "NONE"
side = "SERVER"

[[dependencies.${id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft}"
ordering = "NONE"
side = "SERVER"
