modLoader = "javafml"
loaderVersion = "[${forge_major},)"
license = "${license}"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
description = "${description}"
# Optional on both sides: vanilla clients may join, and a client with it can join any server.
# Installed on a client, it runs on the integrated server (singleplayer, LAN). 1.18.2 registers this in code.
displayTest = "IGNORE_SERVER_VERSION"

[[dependencies.${id}]]
modId = "forge"
mandatory = true
versionRange = "[${forge_major},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"
